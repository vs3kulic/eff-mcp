
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eff-mcp"
version = "0.3.0"
description = "Ethics Filter Framework MCP server"
authors = [
	{ name = "Vajo Sekulic" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "ethics", "requirements-engineering", "agile", "llm", "fastmcp", "ai-safety"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"openai>=1.0.0",
	"fastmcp>=0.1.0",
	"pydantic>=2.0.0",
	"python-dotenv>=1.0.0",
	"supabase>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/vs3kulic/eff-mcp"
Repository = "https://github.com/vs3kulic/eff-mcp"
"Bug Tracker" = "https://github.com/vs3kulic/eff-mcp/issues"
Changelog = "https://github.com/vs3kulic/eff-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
indexing = ["pypdf>=4.0.0"]

[project.scripts]
eff-mcp = "eff.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eff*"]

[tool.setuptools.package-data]
"eff.resources" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
	"integration: tests that require real external services (OpenAI, Supabase) — run with: pytest -m integration",
]
